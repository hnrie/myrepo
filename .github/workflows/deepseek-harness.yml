name: DeepSeek Harness Web Session

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "Session duration in minutes (10-330)"
        required: true
        type: number
        default: 330

permissions:
  contents: write

concurrency:
  group: deepseek-harness-session
  cancel-in-progress: false

jobs:
  harness:
    runs-on: avrea-ubuntu-latest-32-vcpu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate launcher source syntax
        run: |
          node --check scripts/launch.mjs
          node --check scripts/proxy.mjs

      - name: Verify npm latest DeepSeek Harness Web CLI
        env:
          DSH_HOME: ${{ runner.temp }}/deepseek-harness-home
        shell: bash
        run: |
          set -euo pipefail
          echo "npm latest release: $(npm view @deepseek-ai/dsh dist-tags.latest)"
          npx --yes @deepseek-ai/dsh@latest web --help > "$RUNNER_TEMP/dsh-web-help.txt"
          grep -Fq -- '--no-open' "$RUNNER_TEMP/dsh-web-help.txt" || {
            echo "::error::DeepSeek Harness latest lacks --no-open"
            exit 1
          }
          grep -Fq -- '--port' "$RUNNER_TEMP/dsh-web-help.txt" || {
            echo "::error::DeepSeek Harness latest lacks --port"
            exit 1
          }
          echo "DeepSeek Harness npm latest Web CLI is compatible with the loopback proxy."

      - name: Prepare separate persistent code worktree
        shell: bash
        run: |
          set -euo pipefail
          # Keep scripts/launch.mjs and scripts/proxy.mjs on this checkout of
          # main. Never switch the runtime checkout to a stale work branch.
          git fetch origin main
          workspace="$RUNNER_TEMP/agent-workspace"
          if git ls-remote --exit-code --heads origin agent/workspace >/dev/null; then
            git fetch origin agent/workspace
            git worktree add -B agent/workspace "$workspace" origin/agent/workspace
          else
            git worktree add -b agent/workspace "$workspace" HEAD
          fi
          git -C "$workspace" config user.name 'github-actions[bot]'
          git -C "$workspace" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "AGENT_WORKSPACE=$workspace" >> "$GITHUB_ENV"
          test "$(git branch --show-current)" = main
          grep -Fq -- '@deepseek-ai/dsh@latest' scripts/launch.mjs
          if grep -Fq -- "'--public-url'" scripts/launch.mjs; then
            echo "::error::Unexpected old launch argument in the main runtime"
            exit 1
          fi
          echo "Runtime scripts: $(git rev-parse --short HEAD) (main)"
          echo "Agent work branch: $(git -C "$workspace" rev-parse --short HEAD)"
          df -h /

      - name: Prepare stable tunnl.gg SSH identity
        env:
          TUNNL_SSH_PRIVATE_KEY: ${{ secrets.TUNNL_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TUNNL_SSH_PRIVATE_KEY" ]]; then
            echo "::error::Set TUNNL_SSH_PRIVATE_KEY in repository Actions secrets"
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/tunnl"
          printf '%s\n' "$TUNNL_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/tunnl/id_ed25519"
          chmod 600 "$RUNNER_TEMP/tunnl/id_ed25519"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/tunnl/id_ed25519" > /dev/null || {
            echo "::error::TUNNL_SSH_PRIVATE_KEY must be a valid unencrypted SSH private key"
            exit 1
          }
          echo "TUNNL_IDENTITY_FILE=$RUNNER_TEMP/tunnl/id_ed25519" >> "$GITHUB_ENV"

      - name: Check session secrets
        env:
          CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
          HARNESS_ACCESS_PASSWORD: ${{ secrets.HARNESS_ACCESS_PASSWORD }}
        shell: bash
        run: |
          test -n "$CUSTOM_API_KEY" || { echo "::error::Set CUSTOM_API_KEY in Actions secrets"; exit 1; }
          test -n "$HARNESS_ACCESS_PASSWORD" || { echo "::error::Set HARNESS_ACCESS_PASSWORD in Actions secrets"; exit 1; }
          if (( ${{ inputs.session_minutes }} < 10 || ${{ inputs.session_minutes }} > 330 )); then
            echo "::error::Session duration must be 10-330 minutes"
            exit 1
          fi

      - name: Launch DeepSeek Harness Web UI
        env:
          CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
          HARNESS_ACCESS_PASSWORD: ${{ secrets.HARNESS_ACCESS_PASSWORD }}
          SESSION_MINUTES: ${{ inputs.session_minutes }}
          DSH_HOME: ${{ runner.temp }}/deepseek-harness-home
          DSH_TELEMETRY_DISABLED: '1'
        run: node scripts/launch.mjs
