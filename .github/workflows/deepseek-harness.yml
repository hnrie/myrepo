name: DeepSeek Harness Web Session

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "Session duration in minutes (10-330)"
        required: true
        type: number
        default: 330

permissions:
  contents: read
  packages: write

concurrency:
  group: deepseek-harness-session
  cancel-in-progress: false

jobs:
  harness:
    runs-on: avrea-ubuntu-latest-32-vcpu
    steps:
      - name: Checkout current environment controller
        uses: actions/checkout@v4

      - name: Set up Node.js 22 for the host proxy
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate runtime and authentication tests
        run: |
          node --check scripts/launch.mjs
          node --check scripts/harness-config.mjs
          node --check scripts/proxy.mjs
          bash -n scripts/environment-restore.sh
          bash -n scripts/environment-checkpoint.sh
          node --test scripts/proxy.test.mjs scripts/proxy.integration.test.mjs

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Choose persistent Docker image
        shell: bash
        run: |
          set -euo pipefail
          echo "ENV_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-environment:current" >> "$GITHUB_ENV"
          echo "Persistent Docker image: ghcr.io/${GITHUB_REPOSITORY,,}-environment:current"

      - name: Restore complete container filesystem from GHCR
        run: bash scripts/environment-restore.sh

      - name: Prepare stable tunnl.gg SSH identity
        env:
          TUNNL_SSH_PRIVATE_KEY: ${{ secrets.TUNNL_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TUNNL_SSH_PRIVATE_KEY" ]]; then
            echo "::error::Set TUNNL_SSH_PRIVATE_KEY in repository Actions secrets"
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/tunnl"
          printf '%s\n' "$TUNNL_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/tunnl/id_ed25519"
          chmod 600 "$RUNNER_TEMP/tunnl/id_ed25519"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/tunnl/id_ed25519" >/dev/null
          echo "TUNNL_IDENTITY_FILE=$RUNNER_TEMP/tunnl/id_ed25519" >> "$GITHUB_ENV"

      - name: Verify runtime credentials
        env:
          CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
          HARNESS_ACCESS_PASSWORD: ${{ secrets.HARNESS_ACCESS_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CUSTOM_API_KEY" || { echo "::error::Set CUSTOM_API_KEY"; exit 1; }
          if (( ${#HARNESS_ACCESS_PASSWORD} < 16 )); then
            echo "::error::HARNESS_ACCESS_PASSWORD must be 16+ characters"
            exit 1
          fi
          if (( ${{ inputs.session_minutes }} < 10 || ${{ inputs.session_minutes }} > 330 )); then
            echo "::error::Invalid session duration (10-330)"
            exit 1
          fi

      - name: Run containerized DeepSeek Harness with periodic persistence
        env:
          CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
          HARNESS_ACCESS_PASSWORD: ${{ secrets.HARNESS_ACCESS_PASSWORD }}
          SESSION_MINUTES: ${{ inputs.session_minutes }}
          SNAPSHOT_INTERVAL_MINUTES: '20'
          DSH_TELEMETRY_DISABLED: '1'
        run: node scripts/launch.mjs

      - name: Final checkpoint even if agent crashed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if docker ps --format '{{.Names}}' | grep -Fxq deepseek-environment; then
            if [[ -f "$RUNNER_TEMP/environment-final-saved.ok" ]]; then
              echo "The launcher already published its final checkpoint; skipping duplicate upload."
            else
              echo "Publishing fallback final checkpoint to GHCR..."
              bash scripts/environment-checkpoint.sh
            fi
            echo "### Container snapshot" >> "$GITHUB_STEP_SUMMARY"
            echo "Saved image: $ENV_IMAGE" >> "$GITHUB_STEP_SUMMARY"
            docker rm -f deepseek-environment >/dev/null
          else
            echo "No running environment container to snapshot."
          fi
