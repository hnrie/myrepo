name: Proxy Login Regression Tests

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/proxy.mjs'
      - 'scripts/proxy.test.mjs'
      - 'scripts/proxy.integration.test.mjs'
      - 'scripts/proxy.browser.test.mjs'
      - 'scripts/harness-config.mjs'
      - 'scripts/harness-smoke.test.mjs'
      - 'scripts/harness-web-e2e.test.mjs'
      - 'scripts/launch.mjs'
      - '.github/workflows/proxy-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check scripts/proxy.mjs
          node --check scripts/proxy.test.mjs
          node --check scripts/proxy.integration.test.mjs
          node --check scripts/harness-config.mjs
          node --check scripts/harness-smoke.test.mjs
          node --check scripts/harness-web-e2e.test.mjs
          node --check scripts/launch.mjs
      - name: Run mocked DeepSeek authentication and WebSocket security tests
        run: node --test scripts/proxy.test.mjs scripts/proxy.integration.test.mjs
      - name: Install browser test driver (no bundled browser download)
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core
      - name: Run real Chromium cross-origin authentication smoke test
        run: node scripts/proxy.browser.test.mjs
      - name: Start actual npm latest DeepSeek Harness with dummy API key
        run: node scripts/harness-smoke.test.mjs
      - name: Chromium test against real DeepSeek Harness behind TLS proxy
        run: node scripts/harness-web-e2e.test.mjs
